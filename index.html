<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Karta Limitlari Nazorati</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-6 lg:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col sm:flex-row justify-between items-center mb-8 gap-4 border-b border-slate-800 pb-6">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">
                    P2P Card Limits
                </h1>
                <p class="text-slate-400 text-sm mt-1">Kunlik va oylik karta limitlarini professional darajada boshqaring</p>
            </div>
            <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-xl font-medium transition shadow-lg shadow-blue-500/20 flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> Karta qo'shish
            </button>
        </header>

        <div id="cardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </div>

    <div id="cardModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-5">
                <h3 class="text-xl font-semibold text-slate-200">Yangi karta qo'shish</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form id="cardForm" onsubmit="saveCard(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">Karta Turi / Nomi</label>
                    <select id="cardType" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
                        <option value="Uzcard">Uzcard</option>
                        <option value="Humo">Humo</option>
                        <option value="Visa/Master">Visa / Mastercard</option>
                        <option value="Boshqa">Ixtiyoriy nom</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">Karta Egasi / Izoh</label>
                    <input type="text" id="cardName" placeholder="Masalan: Asosiy karta" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">Karta Raqami (16 xonali)</label>
                    <input type="text" id="cardNumber" maxlength="19" placeholder="8600 0000 0000 0000" required oninput="formatCardInput(this)" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white tracking-widest focus:outline-none focus:border-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">Kunlik Limit (UZS)</label>
                        <input type="number" id="dailyLimit" placeholder="50000000" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">Oylik Limit (UZS)</label>
                        <input type="number" id="monthlyLimit" placeholder="500000000" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
                    </div>
                </div>
                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Bekor qilish</button>
                    <button type="submit" class="px-5 py-2 rounded-xl bg-blue-600 text-white hover:bg-blue-500 transition font-medium">Saqlash</button>
                </div>
            </form>
        </div>
    </div>

    <div id="transactionModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-6 shadow-2xl">
            <h3 class="text-xl font-semibold text-slate-200 mb-3">Aylanma kiritish</h3>
            <p class="text-sm text-slate-400 mb-4">Kartaga kelib tushgan yoki o'tkazilgan summani kiriting:</p>
            <form id="transactionForm" onsubmit="addTransaction(event)" class="space-y-4">
                <input type="hidden" id="transCardId">
                <div>
                    <input type="number" id="transAmount" placeholder="Summani kiriting (UZS)" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div class="flex justify-end gap-3">
                    <button type="button" onclick="closeTransModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Bekor qilish</button>
                    <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-600 text-white hover:bg-emerald-500 transition font-medium">Qo'shish</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let cards = JSON.parse(localStorage.getItem('p2p_cards')) || [];

        function openModal() { document.getElementById('cardModal').classList.remove('hidden'); document.getElementById('cardModal').classList.add('flex'); }
        function closeModal() { document.getElementById('cardModal').classList.add('hidden'); document.getElementById('cardModal').classList.remove('flex'); document.getElementById('cardForm').reset(); }
        
        function openTransModal(id) {
            document.getElementById('transCardId').value = id;
            document.getElementById('transactionModal').classList.remove('hidden');
            document.getElementById('transactionModal').classList.add('flex');
        }
        function closeTransModal() {
            document.getElementById('transactionModal').classList.add('hidden');
            document.getElementById('transactionModal').classList.remove('flex');
            document.getElementById('transactionForm').reset();
        }

        // 16 talik raqamni formatlash (XXXX XXXX XXXX XXXX)
        function formatCardInput(input) {
            let value = input.value.replace(/\D/g, '').substring(0, 16);
            let formatted = value.match(/.{1,4}/g)?.join(' ') || '';
            input.value = formatted;
        }

        function saveCard(e) {
            e.preventDefault();
            const newCard = {
                id: Date.now(),
                type: document.getElementById('cardType').value,
                name: document.getElementById('cardName').value,
                number: document.getElementById('cardNumber').value,
                dailyLimit: parseFloat(document.getElementById('dailyLimit').value),
                monthlyLimit: parseFloat(document.getElementById('monthlyLimit').value),
                spentDaily: 0,
                spentMonthly: 0,
                lastResetDate: new Date().toLocaleDateString()
            };
            cards.push(newCard);
            syncStorage();
            closeModal();
            renderCards();
        }

        function addTransaction(e) {
            e.preventDefault();
            const id = Number(document.getElementById('transCardId').value);
            const amount = parseFloat(document.getElementById('transAmount').value);
            
            cards = cards.map(card => {
                if(card.id === id) {
                    card.spentDaily += amount;
                    card.spentMonthly += amount;
                }
                return card;
            });
            
            syncStorage();
            closeTransModal();
            renderCards();
        }

        function deleteCard(id) {
            if(confirm("Haqiqatan ham bu kartani o'chirmoqchimisiz?")) {
                cards = cards.filter(c => c.id !== id);
                syncStorage();
                renderCards();
            }
        }

        function copyNumber(number) {
            navigator.clipboard.writeText(number.replace(/\s/g, ''));
            alert("Karta raqami nusxalandi: " + number);
        }

        function syncStorage() {
            localStorage.setItem('p2p_cards', JSON.stringify(cards));
        }

        function formatMoney(num) {
            return num.toLocaleString('uz-UZ') + " UZS";
        }

        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            if (cards.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-slate-500">
                        <i class="fa-solid fa-credit-card text-4xl mb-3"></i>
                        <p class="text-lg">Hozircha kartalar qo'shilmagan.</p>
                    </div>
                `;
                return;
            }

            cards.forEach(card => {
                // Kunlik va oylik foizlarni hisoblash
                let dailyPercent = Math.min((card.spentDaily / card.dailyLimit) * 100, 100);
                let monthlyPercent = Math.min((card.spentMonthly / card.monthlyLimit) * 100, 100);

                let badgeColor = card.type === 'Humo' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 
                                 card.type === 'Uzcard' ? 'bg-blue-500/10 text-blue-400 border-blue-500/20' : 'bg-purple-500/10 text-purple-400 border-purple-500/20';

                grid.innerHTML += `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl relative overflow-hidden flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <span class="text-xs px-2.5 py-1 rounded-full border font-semibold ${badgeColor}">${card.type}</span>
                                    <h4 class="text-lg font-bold text-slate-100 mt-2">${card.name}</h4>
                                </div>
                                <button onclick="deleteCard(${card.id})" class="text-slate-500 hover:text-red-400 transition"><i class="fa-solid fa-trash-can"></i></button>
                            </div>

                            <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3.5 flex items-center justify-between mb-5">
                                <span class="font-mono text-base tracking-wider text-slate-300">${card.number}</span>
                                <button onclick="copyNumber('${card.number}')" class="text-blue-400 hover:text-blue-300 bg-blue-500/10 p-2 rounded-lg transition" title="Nusxalash">
                                    <i class="fa-regular fa-copy"></i>
                                </button>
                            </div>

                            <div class="space-y-4">
                                <div>
                                    <div class="flex justify-between text-xs mb-1.5">
                                        <span class="text-slate-400">Kunlik limit:</span>
                                        <span class="font-medium text-slate-200">${formatMoney(card.spentDaily)} / <span class="text-slate-400">${formatMoney(card.dailyLimit)}</span></span>
                                    </div>
                                    <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                                        <div class="bg-blue-500 h-full rounded-full transition-all duration-500" style="width: ${dailyPercent}%"></div>
                                    </div>
                                </div>

                                <div>
                                    <div class="flex justify-between text-xs mb-1.5">
                                        <span class="text-slate-400">Oylik limit:</span>
                                        <span class="font-medium text-slate-200">${formatMoney(card.spentMonthly)} / <span class="text-slate-400">${formatMoney(card.monthlyLimit)}</span></span>
                                    </div>
                                    <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                                        <div class="bg-indigo-500 h-full rounded-full transition-all duration-500" style="width: ${monthlyPercent}%"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="mt-6 pt-4 border-t border-slate-800/85 flex gap-2">
                            <button onclick="openTransModal(${card.id})" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 py-2.5 rounded-xl text-sm font-medium transition flex items-center justify-center gap-2">
                                <i class="fa-solid fa-plus-circle text-emerald-400"></i> Aylanma qo'shish
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        // Ilk yuklanganda kartalarni chiqarish
        renderCards();
    </script>
</body>
</html>
